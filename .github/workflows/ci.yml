name: CI

on:
  push:
    branches: [main, rebuild]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  hygiene:
    name: Repository hygiene
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: No forbidden vendor terms in files or history
        run: |
          # Built from parts so this file never contains the words it searches for.
          a=cla; b=ude; c=anthr; d=opic
          pattern="${a}${b}|${c}${d}"
          if git grep -n -i -E "$pattern"; then
            echo "::error::Forbidden word found in tracked files"; exit 1
          fi
          if git log --all --format="%H %an %ae%n%B" | grep -n -i -E "$pattern"; then
            echo "::error::Forbidden vendor term found in history"; exit 1
          fi
          echo "clean: files and history"

  site:
    name: Lint, type-check, build and built-output checks
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm check
      - name: Colour contrast of every token pair in every theme
        run: pnpm check:contrast
      - name: Production build must refuse TODO placeholders
        run: |
          if grep -q '"TODO:' src/config/site.ts && pnpm build; then
            echo "::error::Build succeeded although TODO placeholders remain"; exit 1
          fi
          echo "TODO guard OK"
      - name: Preview build
        run: pnpm build:preview
      - run: pnpm check:dist
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          include-hidden-files: true
          retention-days: 7
      # Later milestones add: html-validate, link check, Playwright + axe, Lighthouse CI.

  php:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        php: ['7.4', '8.1', '8.3']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: curl, mbstring
          coverage: none
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Syntax (php -l)
        run: node scripts/php-lint.mjs
