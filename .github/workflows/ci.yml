name: CI

on:
  push:
    branches: [main, dev, rebuild]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  hygiene:
    name: Repository hygiene
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: No tool credited as an author or co-author
        run: |
          # The project rule: commits are authored by people. No AI tool may appear as an
          # author, committer, co-author or "generated with" line. (The words themselves may
          # appear in files where the product needs them, e.g. naming a data processor.)
          a=cla; b=ude
          tool="${a}${b}|noreply@anthr"
          # Authors, committers and trailers (Co-Authored-By and similar) must not name a tool
          if git log --all --format="%H %an <%ae> %cn <%ce>%n%(trailers)" | grep -n -i -E "$tool"; then
            echo "::error::A tool is credited as an author or co-author"; exit 1
          fi
          # A "Generated with <tool>" line in a message. ("Regenerated with pnpm" is fine.)
          if git log --all --format="%B" | grep -n -i -E "(^|[^a-z])generated (with|by) .*(${tool})"; then
            echo "::error::Tool attribution found in a commit message"; exit 1
          fi
          echo "clean: authors, committers and trailers"

  site:
    name: Lint, type-check, build and built-output checks
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm check
      - name: Colour contrast of every token pair in every theme
        run: pnpm check:contrast
      - name: Production build must refuse TODO placeholders
        run: |
          if grep -q '"TODO:' src/config/site.ts && pnpm build; then
            echo "::error::Build succeeded although TODO placeholders remain"; exit 1
          fi
          echo "TODO guard OK"
      - name: Preview build
        run: pnpm build:preview
      - run: pnpm check:dist
      - name: HTML validation
        run: pnpm check:html
      - name: Internal links and anchors
        run: pnpm check:links
      - name: External links (report only, does not fail the build)
        continue-on-error: true
        run: >
          pnpm exec linkinator dist --recurse --skip "^https://pholoso\.africa"
          --skip "^mailto:" --timeout 15000 --retry
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          include-hidden-files: true
          retention-days: 7

  browser:
    name: Browser tests (Playwright + axe) and Lighthouse
    needs: site
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: Playwright + axe (phone 390×844 and desktop 1280×900)
        run: pnpm test:e2e
      - name: Lighthouse budgets (brief §12)
        run: pnpm test:lighthouse
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-reports
          path: |
            playwright-report/
            .lighthouseci/
          include-hidden-files: true
          retention-days: 14

  php:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        php: ['7.4', '8.1', '8.3']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: curl, mbstring, pdo_sqlite
          coverage: none
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Syntax (php -l)
        run: node scripts/php-lint.mjs
      - name: Form handler tests (Microsoft 365 mock, mail() capture)
        run: php tests/php/contact-test.php
      - name: .htaccess rules (private paths, IfModule wrapping, CSP)
        run: php tests/php/htaccess-test.php
      - name: Parent Coach API (SQLite, mock AI; never the real API)
        run: php tests/php/coach-test.php

  coach-live:
    name: Parent Coach in live mode (PHP API + mock AI, Playwright)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: curl, mbstring, pdo_sqlite
          coverage: none
      - run: pnpm install --frozen-lockfile
      - name: Build with the coach in live mode
        run: pnpm build:live
      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: Live-mode journeys (with and without JavaScript)
        run: pnpm test:e2e:live
