name: Deploy

# Manual release only, after explicit approval. Merging a PR never deploys.
on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    environment:
      name: production
      url: https://pholoso.africa
    env:
      SITE_URL: https://pholoso.africa
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Require current main and passing CI for this exact commit
        run: |
          set -eu
          main=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')
          test "$main" = "$GITHUB_SHA"
          passed=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$GITHUB_SHA&event=push&per_page=100" --jq '[.workflow_runs[] | select(.head_branch == "main")][0].conclusion')
          test "$passed" = success

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build the upload set
        run: node tools/build-dist.mjs

      - name: Require hosting and encrypted backup configuration
        env:
          HOST: ${{ secrets.DEPLOY_HOST }}
          USER: ${{ secrets.DEPLOY_USER }}
          PASSWORD: ${{ secrets.DEPLOY_PASSWORD }}
          BACKUP_PASSWORD: ${{ secrets.DEPLOY_BACKUP_PASSWORD }}
        run: |
          test -n "$HOST" && test -n "$USER" && test -n "$PASSWORD" && test -n "$BACKUP_PASSWORD"

      - name: Install transfer tool
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lftp

      - name: Back up all live files, then upload index.html last
        env:
          PROTO: ${{ vars.DEPLOY_PROTOCOL || 'sftp' }}
          HOST: ${{ secrets.DEPLOY_HOST }}
          PORT: ${{ vars.DEPLOY_PORT }}
          USER: ${{ secrets.DEPLOY_USER }}
          LFTP_PASSWORD: ${{ secrets.DEPLOY_PASSWORD }}
          REMOTE_DIR: ${{ vars.DEPLOY_PATH || 'public_html' }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          BACKUP_PASSWORD: ${{ secrets.DEPLOY_BACKUP_PASSWORD }}
        run: bash tools/deploy.sh

      - name: Retain encrypted pre-release backup
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: production-backup-${{ github.run_id }}
          path: release-backup.tar.gz.enc
          if-no-files-found: ignore
          retention-days: 30

      - name: Verify public release
        run: bash tools/check-live.sh
