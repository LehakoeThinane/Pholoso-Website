name: Deploy

# Uploads the site to the web host after CI passes on main (that is, once a pull
# request is approved and merged). It can also be run by hand from the Actions tab.
# It does nothing until the deployment secrets are set: see DEPLOY.md.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-24.04
    environment:
      name: production
      url: ${{ vars.SITE_URL || 'https://pholoso.africa' }}
    env:
      SITE_URL: ${{ vars.SITE_URL || 'https://pholoso.africa' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build the upload set from deploy-files.txt
        run: node tools/build-dist.mjs

      - name: Check deployment is configured
        id: cfg
        env:
          HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          if [ -z "$HOST" ]; then
            echo "::warning::Deployment secrets are not set, so nothing was uploaded. See DEPLOY.md."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Install lftp
        if: steps.cfg.outputs.ready == 'true'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lftp

      - name: Upload (adds and updates files; never deletes anything on the server)
        if: steps.cfg.outputs.ready == 'true'
        env:
          PROTO: ${{ vars.DEPLOY_PROTOCOL || 'sftp' }}
          HOST: ${{ secrets.DEPLOY_HOST }}
          PORT: ${{ vars.DEPLOY_PORT }}
          USER: ${{ secrets.DEPLOY_USER }}
          LFTP_PASSWORD: ${{ secrets.DEPLOY_PASSWORD }}
          REMOTE_DIR: ${{ vars.DEPLOY_PATH || 'public_html' }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          case "$PROTO" in
            sftp)
              if [ -z "$KNOWN_HOSTS" ]; then
                echo "::error::Set the DEPLOY_KNOWN_HOSTS secret so the server's identity can be checked (DEPLOY.md)."; exit 1
              fi
              mkdir -p ~/.ssh && printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts && chmod 600 ~/.ssh/known_hosts
              port="${PORT:-22}"; settings="set sftp:auto-confirm no;" ;;
            ftps)
              port="${PORT:-21}"; settings="set ftp:ssl-force true; set ftp:ssl-protect-data true; set ssl:verify-certificate true;" ;;
            *)
              echo "::error::DEPLOY_PROTOCOL must be sftp or ftps. Plain FTP would send the password unencrypted."; exit 1 ;;
          esac
          lftp -c "set net:max-retries 2; set net:timeout 30; $settings
            open --env-password -u \"$USER\" -p $port $PROTO://$HOST;
            mirror --reverse --verbose --no-perms --parallel=2 dist/ \"$REMOTE_DIR\""

      - name: Smoke-test the live site
        if: steps.cfg.outputs.ready == 'true'
        run: |
          status() { curl -s -o /dev/null -w '%{http_code}' --max-time 20 "$1"; }
          fail=0
          expect() {
            got=$(status "$2")
            if [ "$got" = "$1" ]; then echo "ok   $1  $2"; else echo "::error::Expected $1 but got $got for $2"; fail=1; fi
          }
          expect 200 "$SITE_URL/"
          expect 200 "$SITE_URL/logo.png"
          expect 405 "$SITE_URL/contact.php"
          expect 404 "$SITE_URL/no-such-page"
          expect 404 "$SITE_URL/.git/HEAD"
          expect 404 "$SITE_URL/docs/"
          expect 404 "$SITE_URL/lib/form-handler.php"
          expect 404 "$SITE_URL/README.md"
          expect 301 "http://${SITE_URL#https://}/"
          for old in "PAF%20Logo%20File.pdf" "PAF_Brand_and_Boilerplate.docx" "milisa-braweni.png" "ATT15207.htaccess"; do
            if [ "$(status "$SITE_URL/$old")" = "200" ]; then
              echo "::warning::$old is still on the server. Delete it by hand (DEPLOY.md)."
            fi
          done
          exit $fail
